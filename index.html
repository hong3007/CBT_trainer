function recordAnswer(cardId, isCorrect){
  const entry = stats[cardId] || { seen:0, wrong:0, lastResult:null, lastSeenAt:0 };
  entry.seen += 1;
  if(!isCorrect) entry.wrong += 1;
  entry.lastResult = isCorrect ? "O" : "X";
  entry.lastSeenAt = Date.now();
  stats[cardId] = entry;
  saveStats(stats);
  scheduleSync();
}

function weightForCard(card){
  const e = stats[card.id];
  const unseen = !e || e.seen === 0;
  const wrongCount = e ? e.wrong : 0;
  return 1 + wrongCount * 3 + (unseen ? 2 : 0);
}

function weightedShuffle(cards){
  return cards
    .map(c => ({ c, key: Math.pow(Math.random(), 1 / weightForCard(c)) }))
    .sort((a,b)=> b.key - a.key)
    .map(x => x.c);
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 원본 CARD_DATA는 건드리지 않고, 매 세션마다 선택지 순서만 섞은 복제본을 만든다.
// answer 값 자체는 그대로 유지되므로 정답 비교 로직에는 영향이 없다.
function withShuffledChoices(card){
  if(!Array.isArray(card.choices) || card.choices.length === 0) return card;
  return { ...card, choices: shuffleArray(card.choices) };
}

function seenCountOf(cardId){
  const e = stats[cardId];
  return e ? e.seen : 0;
}

function buildQueue(subjects, filter){
  let pool = CARD_DATA.filter(c => subjects.includes(c.subject));
  if(filter === "wrong"){
    pool = pool.filter(c => stats[c.id] && stats[c.id].wrong > 0);
  }else if(filter === "unseen"){
    pool = pool.filter(c => !stats[c.id] || stats[c.id].seen === 0);
  }else if(filter === "review"){
    // 복습노트: 틀린 문제 + 풀이횟수가 적은(하위 30%) 문제를 합쳐서 출제
    const wrongSet = pool.filter(c => stats[c.id] && stats[c.id].wrong > 0);
    const sortedBySeen = [...pool].sort((a,b)=> seenCountOf(a.id) - seenCountOf(b.id));
    const lowSeenCount = Math.max(1, Math.ceil(pool.length * 0.3));
    const lowSeenSet = sortedBySeen.slice(0, lowSeenCount);
    const merged = new Map();
    [...wrongSet, ...lowSeenSet].forEach(c => merged.set(c.id, c));
    pool = [...merged.values()];
  }
  // 문제 순서는 매번 새로 섞고(가중 셔플), 각 문제의 선택지 순서도 매번 새로 섞는다.
  // 카드 고유 id(예: s1-01)는 그대로 유지되어 통계/복습노트 추적에 영향 없다.
  return weightedShuffle(pool).map(withShuffledChoices);
}

function startSession(subjects, filter){
  const queue = buildQueue(subjects, filter);
  session = { queue, index:0, correctCount:0, wrongCount:0, flipped:false, selectedChoice:null, filter };
  render("quiz");
}

      <div class="btn-row"><button class="btn secondary" id="backHomeBtn">홈으로</button></div></section>`;
    document.getElementById("backHomeBtn").addEventListener("click", ()=>{ session=null; setActiveTab("home"); render("home"); });
    return;
  }
  if(session.index >= session.queue.length){
    return renderResult();
  }
  const card = session.queue[session.index];
  const hasChoices = Array.isArray(card.choices) && card.choices.length > 0;
  const pct = Math.round((session.index) / session.queue.length * 100);
  const isCorrect = hasChoices ? (session.selectedChoice === card.answer) : null;

  let choicesHtml = "";
  if(hasChoices){
    choicesHtml = `<ul class="choice-list" id="choiceList">
      ${card.choices.map((c,i)=>{
        let cls = "";
        if(session.flipped){
          if(c === card.answer) cls = "correct";
          else if(session.selectedChoice === c) cls = "wrong-pick";
        }
        return `<li class="${cls}${session.flipped?" disabled":""}" data-choice="${encodeURIComponent(c)}">${["①","②","③","④","⑤"][i]||"-"} ${c}</li>`;
      }).join("")}
    </ul>`;
  }

  let backHtml = "";
  if(session.flipped){
    if(hasChoices){
      backHtml = `
        <div class="answer-box">
          <div class="answer-line ${isCorrect?"is-ok":"is-bad"}">${isCorrect?"⭕ 정답이에요":"❌ 오답이에요"}${isCorrect?"":" · 정답 "+card.answer}</div>
          <div class="explanation">${card.explanation || ""}</div>
          ${card.mnemonic ? `<div class="mnemonic-box"><b>암기법 · ${card.mnemonic.kind}</b>${card.mnemonic.text}</div>` : ""}
          ${card.formula ? `<div class="formula-box"><b>공식</b>${card.formula}${card.example ? "\n예시 "+card.example : ""}</div>` : ""}
          <div class="btn-row">
            <button class="btn" id="nextBtn">다음 문제</button>
          </div>
        </div>
      `;
    }else{
      backHtml = `
        <div class="answer-box">
          <div class="answer-line is-ok">정답 · ${card.answer}</div>
          <div class="explanation">${card.explanation || ""}</div>
          ${card.mnemonic ? `<div class="mnemonic-box"><b>암기법 · ${card.mnemonic.kind}</b>${card.mnemonic.text}</div>` : ""}
          ${card.formula ? `<div class="formula-box"><b>공식</b>${card.formula}${card.example ? "\n예시 "+card.example : ""}</div>` : ""}
          <div class="btn-row">
            <button class="btn ok" id="markOk">⭕ 맞았어요</button>
            <button class="btn bad" id="markBad">❌ 틀렸어요</button>
          </div>
        </div>
      `;
    }
  }

  const sc = SUBJECT_COLOR[card.subject];
  root.innerHTML = `
    <section class="panel" style="${subjectStyleVars(card.subject)}">
      <div class="quiz-meta">
        <span class="chip"><span class="chip-dot"></span>${card.subject}과목 · ${card.unit}<span class="chip-id">#${card.id}</span></span>
        <span>${session.index+1} / ${session.queue.length}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="quiz-card-inner">
        <p class="question-text">${card.question}</p>
        ${choicesHtml}
        ${!hasChoices && !session.flipped ? `<div class="btn-row"><button class="btn" id="flipBtn">정답 확인</button></div>` : backHtml}
      </div>
      <div class="btn-row stop-row"><button class="btn secondary" id="stopBtn">중단하기</button></div>
    </section>
  `;
  document.getElementById("stopBtn").addEventListener("click", stopSession);

  if(hasChoices){
    if(!session.flipped){
      document.getElementById("choiceList").addEventListener("click", (e)=>{
        const li = e.target.closest("li[data-choice]");
        if(!li) return;
        const choice = decodeURIComponent(li.dataset.choice);
        session.selectedChoice = choice;
        session.flipped = true;
        const correct = choice === card.answer;
        recordAnswer(card.id, correct);
        if(correct) session.correctCount++; else session.wrongCount++;
        renderQuiz();
      });
    }else{
      document.getElementById("nextBtn").addEventListener("click", goNext);
    }
  }else{
    if(!session.flipped){
      document.getElementById("flipBtn").addEventListener("click", ()=>{
        session.flipped = true;
        renderQuiz();
      });
    }else{
      document.getElementById("markOk").addEventListener("click", ()=> advance(card, true));
      document.getElementById("markBad").addEventListener("click", ()=> advance(card, false));
    }
  }
}

// 지금까지 푼 기록은 문제를 풀 때마다 이미 저장되어 있으므로, 중단하면 결과 화면으로 간다.
function stopSession(){
  if(session.correctCount + session.wrongCount === 0){
    session = null; setActiveTab("home"); render("home"); return;
  }
  session.stopped = true;
  renderResult();
}

function goNext(){
  session.index++;
  session.flipped = false;
  session.selectedChoice = null;
  renderQuiz();
}

function advance(card, isCorrect){
  recordAnswer(card.id, isCorrect);
  if(isCorrect) session.correctCount++; else session.wrongCount++;
  goNext();
}

function renderResult(){
  const total = session.correctCount + session.wrongCount;
  const rate = total ? Math.round(session.correctCount/total*100) : 0;
  const tone = rate >= 80 ? "is-ok" : rate >= 50 ? "" : "is-bad";
  const emoji = rate >= 80 ? "🎉" : rate >= 50 ? "💪" : "🔁";
  const line = rate >= 80 ? "탄탄하게 알고 있어요" : rate >= 50 ? "조금만 더 다지면 돼요" : "복습노트로 약점을 모아볼까요";

      <h2 style="font-size:17px;margin-bottom:4px;">${line}</h2>
      <div class="answer-line ${tone}" style="margin:10px 0 18px;">정답률 ${rate}%</div>
      <p class="section-sub" style="margin-bottom:22px;">${session.stopped ? "중단했어요 · " : ""}이번 세션 ${total}문항 · 정답 ${session.correctCount} · 오답 ${session.wrongCount}${session.stopped ? " · 푼 기록은 저장됐어요" : ""}</p>

        <button class="btn secondary" id="homeBtn">홈으로</button>
        <button class="btn bad" id="retryReviewBtn">복습노트로 다시풀기</button>
      </div>
    </section>
  `;
  document.getElementById("homeBtn").addEventListener("click", ()=>{ session=null; setActiveTab("home"); render("home"); });
  document.getElementById("retryReviewBtn").addEventListener("click", ()=>{ startSession([1,2,3,4,5,6], "review"); });
}

function renderStats(){
  setActiveTab("stats");
  const bySubject = {};
  [1,2,3,4,5,6].forEach(n=> bySubject[n] = { total:0, seenCards:0, seenAttempts:0, correctAttempts:0 });

  CARD_DATA.forEach(c=>{
    bySubject[c.subject].total++;
    const e = stats[c.id];
    if(e && e.seen > 0){
      bySubject[c.subject].seenCards++;
      bySubject[c.subject].seenAttempts += e.seen;
      bySubject[c.subject].correctAttempts += (e.seen - e.wrong);
    }
  });

  const subjectRows = [1,2,3,4,5,6].map(n=>{
    const s = bySubject[n];
    const rate = s.seenAttempts ? Math.round(s.correctAttempts/s.seenAttempts*100) : 0;

    return `<tr>
      <td><span class="chip" style="--dot-color:${c.dot};--chip-tint:${c.bg};--chip-ink:${c.ink};"><span class="chip-dot"></span>${n}과목</span></td>
      <td>${SUBJECT_SHORT[n]}</td>
      <td>${s.seenCards}/${s.total}</td>
      <td>${s.seenAttempts}회</td>
      <td>
        <span class="bar-track"><span class="bar-fill" style="width:${rate}%"></span></span>${rate}%
      </td>
    </tr>`;
  }).join("");

  const totalAttempts = Object.values(bySubject).reduce((sum,s)=> sum + s.seenAttempts, 0);

  const detailRows = CARD_DATA.map(c=>{
    const e = stats[c.id] || { seen:0, wrong:0, lastResult:"-", lastSeenAt:0 };
    const last = e.lastSeenAt ? new Date(e.lastSeenAt).toLocaleDateString() : "-";
    const sc = SUBJECT_COLOR[c.subject];
    const resultBadge = e.lastResult === "O" ? `<span style="color:var(--ok);font-weight:700;">O</span>`
      : e.lastResult === "X" ? `<span style="color:var(--bad);font-weight:700;">X</span>`
      : `<span style="color:var(--sub);">-</span>`;
    return `<tr>
      <td><span class="chip-dot" style="display:inline-block;background:${sc.dot};"></span></td>
      <td>${c.unit}</td>
      <td>${e.seen}</td>
      <td>${e.wrong}</td>
      <td>${resultBadge}</td>
      <td>${last}</td>
    </tr>`;
  }).join("");

  root.innerHTML = `
    <section class="panel">
      <div class="stat-head"><h2 style="margin:0;">과목별 현황</h2><span class="count-badge">전체 풀이횟수 ${totalAttempts}회</span></div>
      <table>
        <thead><tr><th>과목</th><th>이름</th><th>푼/전체</th><th>풀이횟수</th><th>정답률</th></tr></thead>

          <thead><tr><th></th><th>단원</th><th>풀이</th><th>오답</th><th>결과</th><th>최근</th></tr></thead>

function downloadJson(obj, filename){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- 클라우드 동기화 (Supabase) ----------
   키 파일 하나로 기기 간 기록을 공유한다. 서버에는 키로 암호화한 데이터만 저장되고,
   키는 사용자가 받은 키 파일과 이 브라우저에만 있다. 서버 쪽 설정은 supabase.sql 참고. */
const SYNC_URL = "https://unpfcmdbdcpstsdnatud.supabase.co";  // Supabase Project URL (Fridgey와 같은 프로젝트)
const SYNC_ANON = "sb_publishable_v6QdtRd2q62-1zplFR6uzw_LL_WppI8";  // 공개용(publishable) 키. secret/service_role 키는 절대 넣지 말 것
const LS_SYNC_KEY = "saf_eng_trainer_v1_synckey";
const LS_RESET_AT = "saf_eng_trainer_v1_resetat";
let syncKey = null;
try{ syncKey = localStorage.getItem(LS_SYNC_KEY); }catch(e){}
let syncTimer = null, syncQueue = Promise.resolve();
const footerHint = document.querySelector("footer.hint");

function syncEnabled(){ return !!(SYNC_URL && SYNC_ANON && globalThis.crypto && crypto.subtle); }
function toB64(u8){
  let s = "";
  for(let i=0; i<u8.length; i+=8192) s += String.fromCharCode(...u8.subarray(i, i+8192));
  return btoa(s);
}
function fromB64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

// 키에서 행 id(서버 주소 역할)와 암호화 키를 따로 만든다. id만으로는 내용을 풀 수 없다.
async function syncCrypto(keyB64){
  const raw = fromB64(keyB64), te = new TextEncoder();
  const hash = async label => new Uint8Array(await crypto.subtle.digest("SHA-256", new Uint8Array([...te.encode(label), ...raw])));
  const id = [...await hash("cbt-id:")].map(b => b.toString(16).padStart(2,"0")).join("");
  const key = await crypto.subtle.importKey("raw", await hash("cbt-enc:"), "AES-GCM", false, ["encrypt","decrypt"]);
  return { id, key };
}
async function rpc(fn, body){
  const r = await fetch(`${SYNC_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ apikey:SYNC_ANON, Authorization:"Bearer "+SYNC_ANON, "Content-Type":"application/json" },
    body: JSON.stringify(body),
  });
  if(!r.ok) throw new Error(fn+" "+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function remoteGet(c){
  const data = await rpc("cbt_get", { p_id:c.id });
  if(!data) return null;
  const buf = fromB64(data);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:buf.slice(0,12) }, c.key, buf.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function remotePut(c, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, c.key, new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length);
  all.set(iv); all.set(ct, 12);
  await rpc("cbt_put", { p_id:c.id, p_data:toB64(all) });
}

// ponytail: 문제별로 더 최근에 푼 쪽 기록을 채택. 두 기기에서 같은 문제를 동기화 전에 각각 풀면 한쪽 풀이횟수가 빠질 수 있음(드묾).
function mergeStats(a, b){
  const out = { ...a };
  for(const [id, e] of Object.entries(b || {})){
    const o = out[id];
    if(!o || (e.lastSeenAt||0) > (o.lastSeenAt||0)) out[id] = e;
  }
  return out;
}
// 초기화·가져오기를 한 시각(resetAt)보다 오래된 상대편 기록은 버린다. 그래야 다른 기기가 지운 기록을 되살리지 않는다.
function after(s, t){ return Object.fromEntries(Object.entries(s).filter(([,e]) => (e.lastSeenAt||0) > t)); }
function mergeRemote(local, remote){
  if(!remote) return local;
  const l = local.resetAt||0, r = remote.resetAt||0;
  return {
    resetAt: Math.max(l, r),
    stats: mergeStats(r > l ? after(local.stats, r) : local.stats, l > r ? after(remote.stats, l) : remote.stats),
  };
}
function loadResetAt(){ try{ return Number(localStorage.getItem(LS_RESET_AT)) || 0; }catch(e){ return 0; } }
function markReset(){
  try{ localStorage.setItem(LS_RESET_AT, String(Date.now())); }catch(e){}
}

// force: 서버 기록과 합치지 않고 이 기기 기록으로 덮어쓴다(초기화·가져오기 직후).
function syncNow(force){
  if(!syncEnabled() || !syncKey) return syncQueue;
  clearTimeout(syncTimer); syncTimer = null;
  syncQueue = syncQueue.then(async ()=>{
    try{
      const c = await syncCrypto(syncKey);
      const local = { resetAt: loadResetAt(), stats };
      const remote = force ? null : await remoteGet(c);
      const merged = mergeRemote(local, remote);
      const pulled = JSON.stringify(merged.stats) !== JSON.stringify(stats);
      if(pulled){ stats = merged.stats; saveStats(stats); }
      try{ localStorage.setItem(LS_RESET_AT, String(merged.resetAt)); }catch(e){}
      if(force || JSON.stringify(merged) !== JSON.stringify(remote)) await remotePut(c, merged);
      footerHint.textContent = "☁ 동기화됨 · " + new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
      const active = navTabs.querySelector("button.active");
      if(pulled && !session && active && active.dataset.view === "stats") renderStats();
    }catch(e){
      footerHint.textContent = "☁ 동기화 실패 · 이 기기에는 저장돼 있어요";
    }
  });
  return syncQueue;
}
function scheduleSync(){
  if(!syncEnabled() || !syncKey) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncNow(), 1500);
}
function setSyncKey(k){
  syncKey = k;
  try{ localStorage.setItem(LS_SYNC_KEY, k); }catch(e){}
}
function downloadKey(){
  downloadJson({ app:"산업안전기사 CBT 트레이너", note:"이 파일이 있으면 어느 기기에서든 풀이 기록을 불러올 수 있어요. 남에게 주지 마세요.", key:syncKey }, "CBT트레이너_동기화키.json");
}
// 처음 실행(또는 브라우저 데이터를 지운 뒤) 한 번 뜨는 화면

  document.body.appendChild(ov);
  ov.querySelector("#newKeyBtn").addEventListener("click", ()=>{
    setSyncKey(toB64(crypto.getRandomValues(new Uint8Array(32))));
    downloadKey();
    ov.remove();
    syncNow();
  });
  ov.querySelector("#keyInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    file.text().then(t=>{
      const k = JSON.parse(t).key;
      if(!k || fromB64(k).length !== 32) throw new Error("bad key");
      setSyncKey(k);
      ov.remove();
      syncNow();
    }).catch(()=> alert("올바른 키 파일이 아닙니다."));
  });
}

render("home");

if(syncEnabled()){
  if(syncKey) syncNow(); else showSyncOverlay();
  // 앱을 닫거나 다른 앱으로 갈 때 바로 저장하고, 돌아오면 다른 기기 기록을 받아온다.
  document.addEventListener("visibilitychange", ()=>{ if(syncKey) syncNow(); });
}

// 앱 설치(PWA): 웹 주소(http/https)로 열었을 때만 동작. 파일 더블클릭(file://)으로 열면 건너뛴다.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
